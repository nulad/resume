resume_header_intro: "<p>Senior Software Engineer with 15+ years of experience designing, building, and operating high-reliability production systems across fintech, loyalty platforms, e-commerce, and B2B marketplaces. Proven track record leading cloud infrastructure migrations (Azure to AWS), decomposing monoliths into 10+ independently deployable microservices, and building payment systems handling hundreds of millions IDR in monthly transactions. Deep expertise in Node.js, Golang, Java, PHP, and .NET with hands-on production experience across AWS (Lambda, ECS, SQS, Aurora), PostgreSQL, MySQL, Redis, and event-driven architectures. Experienced collaborating with distributed global engineering teams across the US, UK, and Southeast Asia. Based in Greater Jakarta and open to on-site, hybrid, and remote senior software engineering roles.</p>"

